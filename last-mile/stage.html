<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Last Mile Stage</title>
<script>window.__W = 720; window.__H = 1280;</script>
<script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="engine/hud.css">
</head>
<body>
<div id="frame">
  <div id="stage"></div>
  <div id="hud"></div>
</div>
<script type="module">
  for (const f of ['900 40px "Inter Display"', '800 40px "Inter Display"', '700 20px Inter', '600 20px Inter', '500 20px "JetBrains Mono"']) await document.fonts.load(f).catch(() => {});
  const mode = new URLSearchParams(location.search).get('mode') || 'lookdev';
  const m = await import('./engine/driver.js');
  await m.boot(mode);
</script>
</body>
</html>
