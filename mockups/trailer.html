<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Over Budget Trailer</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hud.css">
<script>window.__W = 1280; window.__H = 720;</script>
<script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>
  :root { --ink: #2a1d2e; }
  html, body { margin: 0; background: #000; }
  #frame { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; background: #000; }
  #stage canvas { display: block; }
  #pins, #hud { position: absolute; inset: 0; pointer-events: none; }
  #pins { color: #fff; }
  .ts { text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.35); }

  /* rules cards */
  .tr-card { position: absolute; font-family: 'Lilita One'; line-height: .95; letter-spacing: 1px; white-space: nowrap; transform-origin: 0 100%;
    -webkit-text-stroke: 3px #1b1220; paint-order: stroke fill; text-shadow: 0 7px 0 #1b1220, 0 12px 30px rgba(0,0,0,.45); }
  .tr-card.bl { left: 64px; bottom: 74px; }
  .tr-card.br { right: 64px; bottom: 74px; transform-origin: 100% 100%; text-align: right; }
  .tr-card.tl { left: 64px; top: 64px; transform-origin: 0 0; }
  .tr-card.c { left: 50%; top: 50%; transform-origin: 50% 50%; text-align: center; }
  .tr-card .hl { position: absolute; left: -14px; right: -14px; bottom: 6px; height: 26%; z-index: -1; border-radius: 6px; transform: skewX(-10deg); opacity: .95; }
  .tr-card .sub { font-family: 'Inter'; font-weight: 900; font-size: 22px; letter-spacing: 4px; -webkit-text-stroke: 0; text-shadow: 0 2px 6px rgba(0,0,0,.7); margin-top: 10px; }

  /* voice chat subtitle */
  .tr-voice { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 9px 18px 9px 12px;
    background: rgba(12,8,16,.72); border-radius: 12px; border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(6px); font: 700 24px Inter; white-space: nowrap; }
  .tr-voice b { font-family: 'Lilita One'; font-weight: 400; color: var(--c); font-size: 24px; letter-spacing: .5px; }
  .tr-voice .mic { display: flex; gap: 3px; align-items: center; width: 26px; height: 26px; justify-content: center; border-radius: 50%; background: var(--c); }
  .tr-voice .mic i { width: 3px; border-radius: 2px; background: #fff; }

  /* world pops */
  .tr-money { position: absolute; font-family: 'Lilita One'; font-size: 40px; white-space: nowrap; -webkit-text-stroke: 2.5px #1b1220; paint-order: stroke fill; text-shadow: 0 4px 0 #1b1220; }
  .tr-money.big { font-size: 58px; }
  .tr-comic { position: absolute; font-family: 'Lilita One'; white-space: nowrap; -webkit-text-stroke: 4px #1b1220; paint-order: stroke fill; text-shadow: 0 7px 0 #1b1220; }
  .tr-tag { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; font-family: 'Lilita One'; font-size: 17px; padding: 2px 10px;
    border-radius: 999px; background: rgba(10,6,14,.62); border: 1.5px solid rgba(255,255,255,.22); white-space: nowrap; }
  .tr-tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }

  /* gameplay HUD bits */
  .tr-house { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 360px; padding: 8px 14px 10px; background: rgba(10,6,14,.62); border-radius: 12px;
    border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px); }
  .tr-house .lbl { display: flex; justify-content: space-between; font: 900 13px Inter; letter-spacing: 2px; margin-bottom: 6px; }
  .tr-house .lbl b { font-family: 'Lilita One'; font-weight: 400; font-size: 20px; letter-spacing: 0; color: #8dffa4; }
  .tr-house .bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
  .tr-house .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #3ccf7a, #8dffa4); box-shadow: 0 0 12px rgba(141,255,164,.6); }
  .tr-house .tmr { position: absolute; right: -96px; top: 10px; font: 900 22px Inter; background: rgba(10,6,14,.62); padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); }
  .tr-house.warn .tmr { background: #e8253f; }
  .tr-house.warn .lbl b { color: #ffd23f; }
  .tr-wallets { position: absolute; right: 22px; top: 22px; display: flex; flex-direction: column; gap: 5px; }
  .tr-wallets .w { display: flex; align-items: center; gap: 8px; min-width: 150px; padding: 5px 12px; background: rgba(10,6,14,.62); border-radius: 9px; border-left: 4px solid var(--c);
    font-family: 'Lilita One'; font-size: 17px; backdrop-filter: blur(6px); }
  .tr-wallets .w i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .tr-wallets .w b { margin-left: auto; font-weight: 400; color: #8dffa4; }
  .tr-wallets .w.hi { outline: 2px solid #ffd23f; box-shadow: 0 0 16px rgba(255,210,63,.55); }
  .tr-ring { position: absolute; transform: translate(-29px, -50%); display: flex; align-items: center; gap: 10px; }
  .tr-prompt { display: flex; align-items: center; gap: 9px; font: 800 18px Inter; padding: 6px 12px 6px 6px; background: rgba(10,6,14,.66); border-radius: 9px; white-space: nowrap; border: 1px solid rgba(255,255,255,.12); }
  .tr-prompt .k { min-width: 28px; height: 28px; border-radius: 6px; background: #fff; color: #2a1d2e; font: 900 15px Inter; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.45); }
  .tr-x { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.55); }
  .tr-banner { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 8px 90px; white-space: nowrap; font-family: 'Lilita One'; font-size: 30px; letter-spacing: 1px;
    background: linear-gradient(90deg, rgba(166,92,255,0), rgba(166,92,255,.92) 18%, rgba(166,92,255,.92) 82%, rgba(166,92,255,0)); text-shadow: 0 2px 0 rgba(0,0,0,.3); }

  /* stamp + flash + rewind */
  .tr-stamp { position: absolute; left: 50%; top: 46%; font-family: 'Lilita One'; font-size: 104px; color: #e8253f; border: 12px solid #e8253f; border-radius: 22px; padding: 6px 34px 14px;
    white-space: nowrap; background: rgba(255,250,240,.12); mix-blend-mode: normal; text-shadow: 0 0 1px #e8253f; letter-spacing: 2px; }
  .tr-flash { position: absolute; inset: 0; }
  .tr-vhs { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px); }
  .tr-vhs-txt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: 'VT323'; font-size: 92px; white-space: nowrap; color: #fff;
    text-shadow: 4px 0 0 rgba(255,0,80,.75), -4px 0 0 rgba(0,200,255,.75); }
  .tr-vhs-corner { position: absolute; left: 40px; top: 30px; font-family: 'VT323'; font-size: 54px; color: #fff; text-shadow: 3px 0 0 rgba(255,0,80,.7), -3px 0 0 rgba(0,200,255,.7); }
  .tr-bar { position: absolute; left: 0; right: 0; height: 9px; background: rgba(255,255,255,.55); mix-blend-mode: overlay; }
  .tr-letterbox { position: absolute; left: 0; right: 0; background: #000; }

  /* title */
  .tr-title { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-4deg); text-align: center; }
  .tr-title .logo { font-family: 'Lilita One'; font-size: 150px; line-height: .85; color: #ffd23f; -webkit-text-stroke: 7px #1b1220; paint-order: stroke fill;
    text-shadow: 0 12px 0 #1b1220, 0 18px 40px rgba(0,0,0,.5); letter-spacing: 3px; }
  .tr-title .logo span { color: #ff8a3d; }
  .tr-title .inv { display: inline-block; margin-top: 14px; font: 900 18px Inter; letter-spacing: 6px; color: #fff; background: #e8253f; padding: 6px 16px; border-radius: 6px; transform: rotate(2deg); }
  .tr-tagline { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); font-family: 'Permanent Marker'; font-size: 36px; white-space: nowrap; text-shadow: 0 3px 8px rgba(0,0,0,.7); }
  .tr-badges { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; white-space: nowrap; }
  .tr-badges .b { font: 900 15px Inter; letter-spacing: 3px; padding: 8px 14px; border-radius: 8px; background: rgba(10,6,14,.6); border: 1px solid rgba(255,255,255,.2); }
  .tr-badges .steam { font: 900 20px Inter; letter-spacing: 2px; padding: 12px 22px; border-radius: 10px; background: linear-gradient(180deg, #7ac943, #4c9a2a); color: #fff; box-shadow: 0 5px 0 #2f6a18, 0 10px 24px rgba(0,0,0,.4); }
  .tr-dim { position: absolute; inset: 0; }
  .tr-title .logo .ch { display: inline-block; }
  /* Discord-style voice chat stack */
  .tr-chat { position: absolute; right: 40px; bottom: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tr-chat .row { display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 9px; background: rgba(12,8,16,.74); border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px); font: 700 22px Inter; white-space: nowrap; transform-origin: 100% 100%; }
  .tr-chat .row i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: 2px solid #fff; }
  .tr-chat .row b { font-family: 'Lilita One'; font-weight: 400; font-size: 21px; letter-spacing: .5px; }
  .tr-chat .row .muf { opacity: .7; font-style: italic; filter: blur(.4px); }
</style>
</head>
<body>
<div id="frame">
  <div id="stage"></div>
  <div id="pins"></div>
  <div id="hud"></div>
</div>
<script type="module">
  await document.fonts.load('40px "Lilita One"').catch(() => {});
  await document.fonts.load('20px "Permanent Marker"').catch(() => {});
  await document.fonts.load('20px VT323').catch(() => {});
  await document.fonts.load('900 20px Inter').catch(() => {});
  const m = await import('./trailer/main.js');
  await m.boot();
</script>
</body>
</html>
