<title>TIP BAIT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@500;700;800&display=swap">
<style>
/* One-screen mobile game: canvas fills the frame, HUD floats over it inside the safe area. Single dark look. */
:root {
  --ink: #0d0f12; --ink2: #1b1f25; --paper: #f6f4ef; --mute: #9aa3ad;
  --gobbl: #2ee66f; --gobbl-d: #0c5a2c; --kyle: #ffc83d; --danger: #ff3b30; --ice: #9fe6ff; --boost: #46f08a;
  --display: 'Archivo', 'Arial Narrow', system-ui, sans-serif; --body: 'Figtree', system-ui, -apple-system, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: max(16px, env(safe-area-inset-left, 0px)); --sr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--body); }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; padding-left: var(--sl); padding-right: var(--sr); }
#ui * { box-sizing: border-box; }
.layer { position: absolute; inset: 0; padding: calc(var(--st) + 12px) var(--sr) calc(var(--sb) + 16px) var(--sl); display: flex; flex-direction: column; }
.btn { pointer-events: auto; border: 0; cursor: pointer; font: 900 22px/1 var(--display); font-stretch: 112%; letter-spacing: .5px; color: #04170b; background: linear-gradient(#53f58e, #16b452); border-radius: 22px; padding: 20px 26px; box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 12px 28px rgba(0,0,0,.45); transition: transform .08s; }
.btn:active { transform: scale(.95); }
.btn:focus-visible { outline: 4px solid var(--kyle); outline-offset: 4px; }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); font-size: 17px; padding: 14px 20px; }
.btn.dark { background: var(--ink2); color: var(--paper); box-shadow: 0 0 0 3px rgba(255,255,255,.25); }

/* ---------- loading + title */
#load { background: radial-gradient(120% 80% at 50% 0%, #22303a, var(--ink) 70%); align-items: center; justify-content: center; gap: 18px; text-align: center; pointer-events: auto; }
.logo { font: 900 92px/.86 var(--display); font-stretch: 125%; letter-spacing: -2px; text-transform: uppercase; }
.logo b { display: block; color: var(--gobbl); }
.tagline { font: 700 17px/1.35 var(--body); color: #d7dde3; max-width: 300px; text-wrap: balance; }
.bar { width: 220px; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gobbl); transition: width .2s; }
.small { font: 600 13px var(--body); color: var(--mute); letter-spacing: .3px; }
#title { justify-content: space-between; align-items: center; text-align: center; pointer-events: auto; background: linear-gradient(rgba(13,15,18,.72), rgba(13,15,18,0) 45%, rgba(13,15,18,.85)); }
#title .top { margin-top: 6vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#title .bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 360px; }
#title .btn { width: 100%; font-size: 26px; padding: 22px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { font: 700 12px var(--body); padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.1); color: #e8ecef; }
.chip b { color: var(--gobbl); }
.stats { font: 700 14px var(--body); color: #cfd6dc; font-variant-numeric: tabular-nums; }

/* ---------- order card */
#order { justify-content: center; align-items: center; background: rgba(5,7,9,.55); pointer-events: auto; }
.card { width: 100%; max-width: 360px; background: #fff; color: #111; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
.card .hd { background: #0d0f12; color: var(--gobbl); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font: 900 22px var(--display); font-stretch: 110%; }
.card .hd span { font: 800 11px var(--body); color: #04170b; background: var(--gobbl); padding: 5px 9px; border-radius: 6px; letter-spacing: 1px; }
.card .bd { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.who { display: flex; gap: 12px; align-items: center; }
.av { width: 50px; height: 50px; border-radius: 50%; background: var(--kyle); color: #4a3400; display: grid; place-items: center; font: 900 24px var(--display); flex: none; }
.who .nm { font: 900 24px/1 var(--display); font-stretch: 105%; }
.who .nm small { display: block; font: 700 14px var(--body); color: #5b6470; margin-top: 4px; }
.tip { font: 900 64px/1 var(--display); font-stretch: 112%; color: #11a84a; display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
.tip small { font: 800 15px var(--body); color: #333; }
.note { background: #f1f2f4; border-radius: 12px; padding: 10px 12px; font: 700 15px var(--body); color: #222; }
.route { display: grid; grid-template-columns: 18px 1fr; gap: 6px 10px; font: 700 14px var(--body); color: #333; }
.route i { width: 12px; height: 12px; border-radius: 50%; margin-top: 3px; }
.hold { position: relative; overflow: hidden; width: 100%; font-size: 20px; color: #fff; background: #111; box-shadow: none; }
.hold .fill { position: absolute; inset: 0; width: 0; background: var(--gobbl); }
.hold span { position: relative; }

/* ---------- in-run HUD */
#hud { padding-top: calc(var(--st) + 10px); }
.hudtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill { display: flex; align-items: baseline; gap: 6px; padding: 8px 13px; border-radius: 14px; background: rgba(13,15,18,.78); font: 900 24px var(--display); font-stretch: 105%; font-variant-numeric: tabular-nums; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
.pill small { font: 800 11px var(--body); color: var(--mute); letter-spacing: 1px; }
.pill.late { background: var(--danger); }
.pill.tipv b { color: var(--gobbl); }
.prog { flex: 1; height: 10px; border-radius: 8px; background: rgba(13,15,18,.6); position: relative; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: var(--gobbl); }
.prog em { position: absolute; top: 50%; transform: translate(-50%, -50%); font-style: normal; font-size: 16px; }
.icem { position: absolute; left: var(--sl); top: calc(var(--st) + 70px); width: 40px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.icem .tube { width: 16px; height: 120px; border-radius: 10px; background: rgba(13,15,18,.7); position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.icem .tube i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(var(--ice), #3cb6e0); }
.icem.low .tube i { background: linear-gradient(#ffb36b, #ff6a3d); }
.icem span { font: 800 10px var(--body); letter-spacing: 1px; color: #e9f8ff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.boostb { pointer-events: auto; position: absolute; right: var(--sr); bottom: calc(var(--sb) + 26px); width: 96px; height: 96px; border-radius: 50%; border: 0; display: grid; place-items: center; font: 900 17px var(--display); font-stretch: 110%; color: #04170b; background: conic-gradient(var(--boost) var(--p, 0%), rgba(255,255,255,.18) 0); box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 10px 26px rgba(0,0,0,.45); }
.boostb span { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: rgba(13,15,18,.85); color: #8a96a0; }
.boostb.ready span { background: radial-gradient(circle at 40% 35%, #6af7a2, #13a84a); color: #04170b; animation: pulse .8s infinite alternate; }
@keyframes pulse { to { transform: scale(1.06); } }
.dms { position: absolute; right: var(--sr); top: calc(var(--st) + 128px); width: min(330px, 34vw); display: flex; flex-direction: column; gap: 8px; z-index: 4; pointer-events: none; }
.dm { display: flex; gap: 11px; align-items: center; padding: 10px 14px 11px 10px; border-radius: 18px; background: rgba(246,246,248,.96); color: #111; box-shadow: 0 10px 26px rgba(0,0,0,.35); animation: toastIn .38s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes toastIn { from { transform: translateX(115%); opacity: 0; } }
.dm.out { animation: toastOut .3s forwards !important; }
@keyframes toastOut { to { transform: translateX(115%); opacity: 0; } }
.dm .av { width: 38px; height: 38px; font-size: 18px; flex: none; }
.dm .bub { font: 700 16px/1.3 var(--body); min-width: 0; }
.dm .bub small { display: block; font: 700 11px var(--body); color: #6b7280; letter-spacing: .2px; margin-bottom: 1px; }
.dm .bub small b { color: #111; font-weight: 900; }
.dm.angry { background: #fff1f0; box-shadow: 0 0 0 2px var(--danger), 0 10px 26px rgba(0,0,0,.35); }
.dm.sys .av { background: var(--gobbl); color: #0d0f12; }
.thought { position: absolute; left: calc(var(--sl) + 56px); top: calc(var(--st) + 78px); max-width: min(380px, 60vw); padding: 9px 14px; border-radius: 16px 16px 16px 4px; background: rgba(13,15,18,.8); color: #e8ecef; font: italic 700 16px/1.3 var(--body); animation: dmIn .3s both; z-index: 3; }
.dm.out { animation: dmOut .3s forwards; }
@keyframes dmIn { from { transform: scale(.4); opacity: 0; } }
@keyframes dmOut { to { transform: translateX(-30px); opacity: 0; } }
.pop { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) rotate(-5deg); font: 900 44px var(--display); font-stretch: 115%; color: #fff; -webkit-text-stroke: 7px #0d0f12; paint-order: stroke fill; white-space: nowrap; animation: popA .9s forwards; text-align: center; }
.pop small { display: block; font: 900 22px var(--display); color: var(--gobbl); -webkit-text-stroke: 5px #0d0f12; }
@keyframes popA { 0% { transform: translate(-50%, -50%) scale(.3) rotate(-5deg); } 25% { transform: translate(-50%, -50%) scale(1.1) rotate(-5deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1) rotate(-5deg); } }
.speed { position: absolute; inset: -10%; pointer-events: none; opacity: 0; transition: opacity .15s; background: repeating-conic-gradient(from 0deg at 50% 46%, transparent 0deg 4deg, rgba(255,255,255,.7) 4deg 4.5deg, transparent 4.5deg 9deg, rgba(160,255,200,.55) 9deg 9.4deg, transparent 9.4deg 14deg); -webkit-mask: radial-gradient(circle at 50% 46%, transparent 32%, rgba(0,0,0,.6) 55%, #000 78%); mask: radial-gradient(circle at 50% 46%, transparent 32%, rgba(0,0,0,.6) 55%, #000 78%); }
.bglow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: inset 0 0 120px 30px rgba(46,230,111,.55); animation: bglow .5s infinite alternate; }
@keyframes bglow { to { box-shadow: inset 0 0 160px 50px rgba(46,230,111,.35); } }
.flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 60%, rgba(220,255,235,.85), rgba(46,230,111,.35) 45%, transparent 75%); animation: flashA .42s forwards; z-index: 6; }
@keyframes flashA { from { opacity: 1; } to { opacity: 0; } }
.hint { position: absolute; left: 0; right: 0; bottom: calc(var(--sb) + 150px); text-align: center; font: 800 18px var(--body); color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.8); transition: opacity .4s; }
.hint b { display: inline-block; padding: 4px 10px; margin: 0 3px; border-radius: 8px; background: rgba(13,15,18,.7); }
.place { position: absolute; left: 50%; top: calc(var(--st) + 156px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 16px; background: rgba(13,15,18,.78); white-space: nowrap; animation: dmIn .3s both; }
.place i { width: 26px; height: 26px; border-radius: 50%; background: var(--gobbl); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.place b { display: block; font: 900 18px var(--display); font-stretch: 105%; }
.place small { font: 700 11px var(--body); color: var(--mute); letter-spacing: .6px; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font: 900 150px var(--display); font-stretch: 120%; color: #fff; -webkit-text-stroke: 10px #0d0f12; paint-order: stroke fill; }

/* ---------- crash / ad */
#crash { align-items: center; justify-content: center; gap: 18px; text-align: center; pointer-events: auto; background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.15), rgba(0,0,0,.6)); }
.wo { font: 900 76px/.9 var(--display); font-stretch: 118%; color: var(--danger); -webkit-text-stroke: 7px #fff; paint-order: stroke fill; transform: rotate(-4deg); text-shadow: 0 14px 40px rgba(0,0,0,.6); }
.wsub { font: 800 20px var(--body); text-shadow: 0 3px 12px rgba(0,0,0,.8); }
.wsub b { color: var(--gobbl); }
#crash .btn { font-size: 21px; width: 100%; max-width: 340px; }
#crash .btn small { display: block; font: 700 13px var(--body); color: #0b4a22; margin-top: 6px; }
#ad { background: radial-gradient(circle at 50% 30%, #2b1b4a, #0c0a14 70%); align-items: center; text-align: center; pointer-events: auto; }
#ad .adtop { width: 100%; display: flex; justify-content: space-between; font: 800 14px var(--body); }
#ad .adtop span { padding: 7px 13px; border-radius: 20px; background: rgba(255,255,255,.15); }
#ad .adtop .rw { background: var(--kyle); color: #3a2a00; font-variant-numeric: tabular-nums; }
#ad .adbody { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
.adbig { font-size: 96px; line-height: 1; }
.adlogo { font: 900 64px/.9 var(--display); font-stretch: 120%; }
.adlogo b { color: var(--gobbl); }
.adh { font: 900 34px var(--display); color: var(--kyle); }
.adq { font: italic 800 20px var(--body); color: #e9e3ff; max-width: 300px; }
.adp { font: 900 56px var(--display); }
.adp small { font: 800 18px var(--body); color: #bbb; }
.adfine { font: 600 12px var(--body); color: #9a93b5; max-width: 300px; }

/* ---------- finale */
#scene { justify-content: flex-end; align-items: center; gap: 14px; text-align: center; pointer-events: auto; }
.cap { font: 900 40px/1.05 var(--display); font-stretch: 110%; color: #fff; -webkit-text-stroke: 6px #0d0f12; paint-order: stroke fill; text-wrap: balance; max-width: 360px; }
.cap em { font-style: normal; color: var(--kyle); }
.cap s { color: var(--danger); }
.real { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 360px; }
.real figure { margin: 0; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 3/4; background: #222; box-shadow: 0 10px 26px rgba(0,0,0,.45); }
.real img, .real canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.real figcaption { position: absolute; left: 8px; top: 8px; font: 900 11px var(--body); letter-spacing: 1px; padding: 5px 8px; border-radius: 7px; background: #fff; color: #111; }
.real figure:last-child figcaption { background: var(--gobbl); }
.tapc { font: 800 14px var(--body); color: #e6ebef; opacity: .85; animation: blink 1s infinite alternate; }
@keyframes blink { to { opacity: .35; } }
.stairs { position: absolute; left: var(--sl); right: var(--sr); bottom: calc(var(--sb) + 24px); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; pointer-events: auto; }
.stairs button { height: 140px; border-radius: 28px; border: 0; font: 900 34px var(--display); font-stretch: 115%; color: #04170b; background: linear-gradient(#53f58e, #16b452); box-shadow: 0 0 0 4px rgba(255,255,255,.85); touch-action: manipulation; }
.stairs button.next { animation: pulse .35s infinite alternate; }
.stairs button:not(.next) { filter: grayscale(.7) brightness(.7); }
.floor { position: absolute; right: var(--sr); top: calc(var(--st) + 70px); text-align: right; font: 900 120px/.85 var(--display); font-stretch: 118%; color: #fff; -webkit-text-stroke: 8px #0d0f12; paint-order: stroke fill; font-variant-numeric: tabular-nums; }
.floor small { display: block; font: 900 18px var(--body); color: var(--gobbl); -webkit-text-stroke: 0; letter-spacing: 3px; }
.floor.done { color: var(--gobbl); }
.tbar { position: absolute; left: var(--sl); right: var(--sr); top: calc(var(--st) + 14px); height: 12px; border-radius: 8px; background: rgba(13,15,18,.7); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--kyle); }
.notif { width: 100%; max-width: 380px; display: flex; gap: 12px; align-items: center; padding: 13px 15px; border-radius: 20px; background: rgba(245,245,247,.97); color: #111; text-align: left; box-shadow: 0 14px 36px rgba(0,0,0,.4); animation: dmIn .35s both; }
.notif .ic { width: 40px; height: 40px; border-radius: 10px; background: #0d0f12; color: var(--gobbl); display: grid; place-items: center; font: 900 22px var(--display); flex: none; }
.notif b { display: block; font: 800 16px var(--body); }
.notif small { font: 600 14px var(--body); color: #444; }
.tipchg { display: flex; flex-direction: column; align-items: center; font: 900 90px/.95 var(--display); font-stretch: 112%; font-variant-numeric: tabular-nums; }
.tipchg s { font-size: 46px; color: #fff; text-decoration-color: var(--danger); text-decoration-thickness: 6px; -webkit-text-stroke: 5px #0d0f12; paint-order: stroke fill; }
.tipchg b { color: var(--danger); -webkit-text-stroke: 7px #fff; paint-order: stroke fill; animation: slam .4s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes slam { from { transform: scale(2.4); opacity: 0; } }
#results { justify-content: safe center; align-items: center; padding-top: max(16px, var(--st)); padding-bottom: 16px; background: rgba(8,10,12,.82); pointer-events: auto; overflow-y: auto; }
.res { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
.res h2 { margin: 0; font: 900 44px/.95 var(--display); font-stretch: 115%; text-transform: uppercase; text-wrap: balance; }
.res h2 em { font-style: normal; color: var(--kyle); }
.ledger { background: #fff; color: #111; border-radius: 20px; padding: 6px 16px; font: 700 16px var(--body); font-variant-numeric: tabular-nums; }
.ledger div { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #e7e8ea; gap: 10px; }
.ledger div:last-child { border: 0; font: 900 22px var(--display); }
.ledger s { color: #9aa1a8; } .ledger .z { color: var(--danger); font-weight: 900; }
.kv { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kv b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dogui { pointer-events: none; padding: 0; }
.dogui { position: absolute; left: 50%; top: calc(var(--st, 0px) + 18px); transform: translateX(-50%); width: min(520px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; padding: 12px 16px; border-radius: 18px; background: rgba(13,15,18,.72); box-shadow: 0 10px 26px rgba(0,0,0,.4); }
.dtitle { font: 900 26px var(--display); font-stretch: 112%; letter-spacing: .5px; color: #fff; }
.dogui.fin .dtitle { color: var(--gobbl); animation: bump .35s; }
.dpips { display: flex; gap: 10px; }
.dpips i { width: 34px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.18); transition: background .15s; }
.dpips i.ok { background: var(--gobbl); box-shadow: 0 0 12px var(--gobbl); }
.dpips i.bit { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
.dpips i.mid { background: var(--kyle); box-shadow: 0 0 12px var(--kyle); }
.balbar { position: relative; width: 100%; height: 18px; border-radius: 9px; background: linear-gradient(90deg, #ff3b30 0%, #ffb02e 22%, #2ee66f 40%, #2ee66f 60%, #ffb02e 78%, #ff3b30 100%); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); margin-top: 2px; }
.balbar .bz { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: #fff; opacity: .7; }
.balbar .bn { position: absolute; top: -7px; width: 8px; height: 32px; margin-left: -4px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 2px #0d0f12, 0 2px 6px rgba(0,0,0,.6); transition: left .04s linear; }
.balbar b { position: absolute; top: 22px; font: 800 10px var(--body); letter-spacing: .6px; color: #c9d0d6; text-transform: uppercase; }
.balbar .bl { left: 0; } .balbar .br { right: 0; }
.balbar.warn .bn { background: #ffb02e; }
.balbar.slip { animation: balShake .12s infinite; }
.balbar.slip .bn { background: #ff3b30; }
@keyframes balShake { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
.dogui:has(.balbar) { padding-bottom: 26px; }
.dogui.run { top: calc(var(--st) + 96px); width: min(560px, calc(100% - 32px)); }
.dogui.bad .dtitle { color: var(--danger); }
.say { position: absolute; right: calc(var(--sr) + 16px); top: calc(var(--st) + 200px); max-width: min(340px, 50vw); padding: 9px 14px; border-radius: 16px 16px 4px 16px; background: #ff5a1f; color: #fff; font: 800 17px/1.3 var(--body); box-shadow: 0 8px 22px rgba(0,0,0,.35); animation: dmIn .3s both; z-index: 3; }
.tipchg.kept b { color: var(--gobbl); }
.cap em.kept { color: var(--gobbl); }
.copysheet { margin: auto; width: min(460px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 18px; background: #12151a; box-shadow: 0 0 0 2px var(--gobbl), 0 20px 50px rgba(0,0,0,.6); pointer-events: auto; }
.copysheet textarea { -webkit-user-select: text; user-select: text; height: 200px; resize: none; border-radius: 12px; border: 0; padding: 10px; font: 600 14px/1.4 var(--body); background: #1d2128; color: #fff; }

.card2 .sw { height: 64px; border-radius: 11px; display: grid; place-items: center; font-size: 34px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.card2 .nm { font: 800 14px/1.15 var(--body); }
.card2 .st { font-style: normal; font: 900 14px var(--display); color: var(--kyle); }
.card2 .st.poor { color: #8a8f96; }
.card2 .st.own { color: #cfd6dc; font-size: 12px; letter-spacing: 1px; }
.card2 .st.eq { color: var(--gobbl); font-size: 12px; letter-spacing: 1px; }
.card2.wacky { background: linear-gradient(rgba(20,16,30,.9), rgba(20,16,30,.9)) padding-box, conic-gradient(from var(--a, 0deg), #ff3b3b, #ffd23b, #3bff6a, #3bb4ff, #a33bff, #ff3b3b) border-box; border: 2px solid transparent; animation: wackyspin 3s linear infinite; }
.card2.wacky.sel { box-shadow: 0 0 0 3px var(--gobbl), 0 0 24px rgba(163,59,255,.5); }
.card2 .wk { position: absolute; top: 4px; right: 4px; font: 900 9px var(--body); font-style: normal; letter-spacing: 1px; padding: 3px 6px; border-radius: 6px; background: #a33bff; color: #fff; transform: rotate(4deg); }
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes wackyspin { to { --a: 360deg; } }
.shp-ft { display: flex; gap: 12px; align-items: center; }
.shp-info { flex: 1; min-width: 0; }
.shp-info b { display: block; font: 900 20px var(--display); color: #fff; }
.shp-info small { display: block; font: 600 13px/1.3 var(--body); color: #b9c1c8; }
.shp-act { flex: none; min-width: 168px; font-size: 18px; padding: 16px 18px; }
.shp-act.done { background: rgba(255,255,255,.12); color: var(--gobbl); box-shadow: none; }
.shp-act.poor { background: rgba(255,255,255,.1); color: #9aa0a6; box-shadow: none; font-size: 15px; }
.shp-act.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.shp-burst { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-4deg); font: 900 34px var(--display); color: var(--kyle); -webkit-text-stroke: 6px #0d0f12; paint-order: stroke fill; white-space: nowrap; animation: popA 1.2s forwards; pointer-events: none; }
.walletline { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255,200,61,.1); font: 700 13px var(--body); color: #e8dcb8; }
.walletline span { flex: 1; }
.walletline b { font: 900 18px var(--display); color: var(--kyle); }
.walletline .shopbtn { flex: none; font-size: 13px; padding: 8px 12px; }
@media (max-aspect-ratio: 1/1) {
  .shp { left: 0; right: 0; top: auto; width: auto; height: 58%; border-radius: 22px 22px 0 0; padding: 14px 14px calc(var(--sb) + 12px); background: rgba(10,11,14,.94); }
  .shp-title { font-size: 22px; }
  .shp-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card2 .sw { height: 50px; font-size: 26px; }

}
/* ---- crates, collection, coin sheet ---- */
.shp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.shp-tabs button small { display: block; font: 800 10px var(--body); opacity: .75; margin-top: 2px; }
.shp-tabs.top button { font-size: 15px; padding: 12px 6px; }
.buycoins { border: 0; border-radius: 12px; padding: 9px 11px; background: linear-gradient(#ffd96a, #f0a91a); color: #3a2600; font: 900 13px var(--body); cursor: pointer; white-space: nowrap; box-shadow: 0 0 0 2px rgba(255,255,255,.6); }
.crates { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.crate { display: grid; grid-template-columns: 96px 1fr; grid-template-rows: auto auto; gap: 6px 12px; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.06); cursor: pointer; }
.crate.sel { box-shadow: 0 0 0 3px var(--gobbl); background: rgba(46,230,111,.08); }
.crate .cart { grid-row: span 2; display: grid; place-items: center; }
.cinfo b { display: block; font: 900 20px var(--display); color: #fff; }
.cinfo small { display: block; font: 600 12px var(--body); color: #b9c1c8; margin-bottom: 6px; }
.odds { display: flex; flex-wrap: wrap; gap: 4px; }
.odds span { font: 900 12px var(--display); color: #fff; background: color-mix(in srgb, var(--rc) 22%, transparent); border: 1px solid var(--rc); border-radius: 7px; padding: 2px 6px; }
.odds em { font-style: normal; font: 800 9px var(--body); letter-spacing: .6px; color: var(--rc); margin-right: 4px; }
.copen { grid-column: 2; justify-self: start; font-size: 16px; padding: 11px 16px; }
.copen.poor { background: rgba(255,255,255,.1); color: #9aa0a6; box-shadow: none; font-size: 13px; }
.copen.shake { animation: shake .35s; }
.pity { padding: 10px 12px; border-radius: 14px; background: rgba(255,182,39,.08); color: #e8dcb8; font: 700 12px var(--body); display: flex; flex-direction: column; gap: 6px; }
.pity b { color: #ffb627; letter-spacing: .6px; }
.pity span { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.pity span i { display: block; height: 100%; background: linear-gradient(90deg, #a23bff, #ffb627); }
.pity small em { font-style: normal; font-weight: 900; }
/* crate art (pure CSS: lid, body, glowing seam) */
.crateart { --c1: #1d2228; --c2: #2ee66f; --glow: #ffffff; position: relative; width: 84px; height: 70px; }
.crateart.look-prem { --c1: #15121a; --c2: #ffb627; }
.crateart.look-multi { --c1: #1a1030; --c2: #c77dff; }
.crateart .cbody { position: absolute; inset: 22% 0 0; border-radius: 8px; background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 70%, #fff 8%), var(--c1)); box-shadow: inset 0 0 0 3px var(--c2), inset 0 -10px 18px rgba(0,0,0,.5), 0 8px 18px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.crateart .cbody b { font: 900 18px var(--display); color: var(--c2); line-height: 1; }
.crateart .cbody i { font: 900 8px var(--body); letter-spacing: 1.6px; color: #fff; opacity: .8; font-style: normal; }
.crateart .clid { position: absolute; left: -4%; right: -4%; top: 6%; height: 22%; border-radius: 6px; background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 60%, #fff 14%), var(--c1)); box-shadow: inset 0 0 0 3px var(--c2), 0 4px 10px rgba(0,0,0,.4); transform-origin: 10% 100%; z-index: 2; }
.crateart .cseam { position: absolute; left: 2%; right: 2%; top: 26%; height: 3px; border-radius: 3px; background: var(--glow); opacity: 0; box-shadow: 0 0 10px 3px var(--glow), 0 0 40px 10px var(--glow); z-index: 3; }
.crateart.big { width: min(300px, 62vw); height: min(250px, 52vw); }
.crateart.big .cbody b { font-size: min(64px, 13vw); }
.crateart.big .cbody i { font-size: 16px; }
.crateart.big .cseam { height: 6px; opacity: .9; transition: background .2s, box-shadow .2s; }
/* the opening */
#crateopen { pointer-events: auto; padding: 0; z-index: 30; background: radial-gradient(circle at 50% 46%, rgba(20,22,30,.82), rgba(4,5,8,.97) 70%); transition: background .6s; overflow: hidden; }
#crateopen .cfx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
#crateopen .cstage { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 3; animation: cdrop .55s cubic-bezier(.3,1.5,.5,1) both; filter: drop-shadow(0 0 30px color-mix(in srgb, var(--glow) 60%, transparent)); }
@keyframes cdrop { from { transform: translate(-50%, -160%) scale(.7); opacity: 0; } }
#crateopen .cstage.punch { animation: cpunch .45s ease-out both; }
@keyframes cpunch { 0% { transform: translate(-50%, -50%) scale(1.15); } 100% { transform: translate(-50%, -50%) scale(1); } }
#crateopen.popped .clid { animation: lidoff .7s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes lidoff { to { transform: translate(40%, -260%) rotate(-58deg); opacity: 0; } }
#crateopen.popped .cstage { opacity: .0; transition: opacity .5s .35s; }
#crateopen .crays { position: absolute; left: 50%; top: 46%; width: 220vmax; height: 220vmax; transform: translate(-50%, -50%); z-index: 1; opacity: 0; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--glow) 55%, transparent) 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 45%); mask: radial-gradient(circle, #000 0, transparent 45%); transition: opacity .4s; animation: rays 14s linear infinite; }
#crateopen.popped .crays { opacity: .7; }
#crateopen.mythic .crays { background: repeating-conic-gradient(from 0deg, rgba(255,60,80,.6) 0 6deg, transparent 6deg 12deg, rgba(255,210,60,.55) 12deg 18deg, transparent 18deg 24deg, rgba(80,170,255,.55) 24deg 30deg, transparent 30deg 36deg); }
@keyframes rays { to { transform: translate(-50%, -50%) rotate(360deg); } }
#crateopen .cvig { position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 0 0 transparent; transition: box-shadow .5s; }
#crateopen.edge .cvig { box-shadow: inset 0 0 140px 30px var(--glow); animation: edgepulse 1.2s ease-in-out infinite alternate; }
@keyframes edgepulse { to { box-shadow: inset 0 0 90px 14px var(--glow); } }
#crateopen.cpause { background: radial-gradient(circle at 50% 46%, rgba(10,10,14,.9), #000 60%); }
#crateopen .cflash { position: absolute; inset: 0; z-index: 7; pointer-events: none; background: #fff; opacity: 0; }
#crateopen.popped .cflash { animation: flash .55s ease-out; }
#crateopen .cskip { position: absolute; bottom: calc(var(--sb) + 14px); left: 50%; transform: translateX(-50%); font: 700 12px var(--body); color: rgba(255,255,255,.45); letter-spacing: 1px; opacity: 0; transition: opacity .3s; z-index: 8; }
#crateopen.canskip:not(.revealed) .cskip { opacity: 1; }
/* reel */
#crateopen .creel { position: absolute; left: 0; right: 0; top: 46%; height: 190px; transform: translateY(-50%) scale(.9); opacity: 0; z-index: 4; transition: opacity .35s, transform .35s; background: linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.2) 25%, rgba(0,0,0,.2) 75%, rgba(0,0,0,.85)); border-block: 2px solid rgba(255,255,255,.12); overflow: hidden; }
#crateopen .creel.on { opacity: 1; transform: translateY(-50%) scale(1); }
#crateopen .cstrip { position: absolute; left: 50%; top: 14px; display: flex; gap: 8px; will-change: transform; }
#crateopen .cmark { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #ffd23b; box-shadow: 0 0 14px 3px rgba(255,210,59,.8); z-index: 2; }
#crateopen .cmark::before, #crateopen .cmark::after { content: ''; position: absolute; left: -8px; border: 10px solid transparent; }
#crateopen .cmark::before { top: 0; border-top-color: #ffd23b; }
#crateopen .cmark::after { bottom: 0; border-bottom-color: #ffd23b; }
#crateopen.revealed .creel { top: auto; bottom: calc(var(--sb) + 8px); transform: none; height: 160px; opacity: .35; transition: opacity .5s, top .5s; }
.lcard { position: relative; flex: none; width: 132px; height: 160px; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, rgba(255,255,255,.08), color-mix(in srgb, var(--rc) 35%, #0d0f12)); box-shadow: inset 0 -4px 0 var(--rc), inset 0 0 0 1px rgba(255,255,255,.1); }
.lcard .sw { height: 86px; border-radius: 8px; display: grid; place-items: center; font-size: 42px; }
.lcard .nm { font: 800 13px/1.15 var(--body); color: #fff; }
.lcard i { font-style: normal; font: 900 10px var(--body); letter-spacing: 1px; color: var(--rc); }
.lcard em { position: absolute; top: 6px; right: 6px; font-style: normal; font: 900 10px var(--body); padding: 2px 6px; border-radius: 6px; z-index: 2; }
.lcard em.new { background: var(--gobbl); color: #04170b; }
.lcard em.dupe { background: #ffd23b; color: #3a2600; }
.lcard.r-legendary, .lcard.r-mythic { box-shadow: inset 0 -4px 0 var(--rc), inset 0 0 0 1px rgba(255,255,255,.1), 0 0 18px color-mix(in srgb, var(--rc) 60%, transparent); }
.lcard.r-mythic { background: linear-gradient(180deg, rgba(255,255,255,.1), #5a0f22), linear-gradient(90deg, #ff3b3b, #ffd23b, #3bb4ff); }
/* multi cards */
#crateopen .ccards { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); display: flex; gap: 12px; z-index: 5; opacity: 0; pointer-events: none; }
#crateopen .ccards.on { opacity: 1; pointer-events: auto; }
.mcard { width: 132px; height: 160px; perspective: 800px; cursor: pointer; animation: mout .6s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i) * .08s); }
@keyframes mout { from { transform: translateY(40vh) scale(.4) rotate(calc((var(--i) - 2) * 12deg)); opacity: 0; } }
.mcard > div { position: absolute; width: 132px; height: 160px; backface-visibility: hidden; transition: transform .45s cubic-bezier(.3,1.4,.5,1); border-radius: 12px; }
.mcard .mback { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 70%, #fff 10%), #0d0f12 75%); box-shadow: 0 0 22px 2px color-mix(in srgb, var(--rc) 70%, transparent), inset 0 0 0 2px var(--rc); }
.mcard .mback::after { content: 'gobbl'; position: absolute; inset: 0; display: grid; place-items: center; font: 900 26px var(--display); color: rgba(255,255,255,.85); }
.mcard .mface { transform: rotateY(180deg); }
.mcard.flip .mback { transform: rotateY(-180deg); }
.mcard.flip .mface { transform: rotateY(0); }
.mcard.sel .lcard { outline: 3px solid #fff; outline-offset: 2px; }
#crateopen.revealed .ccards { top: auto; bottom: calc(var(--sb) + 14px); transform: translateX(-50%) scale(.72); transform-origin: 50% 100%; transition: all .5s; }
/* reveal */
#crateopen.revealed { background: linear-gradient(90deg, rgba(4,5,8,.25), rgba(4,5,8,0) 40%, rgba(4,5,8,.75)); }
#crateopen.revealed .crays { opacity: .18; }
#crateopen .creveal { position: absolute; right: calc(var(--sr) + 24px); top: 50%; transform: translate(30px, -50%); width: min(380px, 42vw); opacity: 0; z-index: 8; transition: opacity .4s .15s, transform .4s .15s; display: flex; flex-direction: column; gap: 8px; color: #fff; pointer-events: none; }
#crateopen .creveal.on { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
.creveal .rban { align-self: flex-start; font: 900 14px var(--display); letter-spacing: 2px; padding: 6px 12px; border-radius: 8px; background: var(--rc); color: #0d0f12; box-shadow: 0 0 24px color-mix(in srgb, var(--rc) 70%, transparent); }
.creveal.r-mythic .rban { background: linear-gradient(90deg, #ff3b3b, #ffd23b, #3bff6a, #3bb4ff, #a33bff); background-size: 200% 100%; animation: rb 2s linear infinite; }
@keyframes rb { to { background-position: 200% 0; } }
.creveal b { font: 900 40px/1 var(--display); font-stretch: 110%; text-shadow: 0 0 30px color-mix(in srgb, var(--rc) 60%, transparent); }
.creveal small { font: 600 14px/1.35 var(--body); color: #cfd6dc; }
.creveal .rnew { font: 900 13px var(--body); color: var(--gobbl); letter-spacing: .6px; }
.creveal .rdupe { font: 900 13px var(--body); color: #ffd23b; letter-spacing: .6px; }
.creveal .rbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.creveal .rbtns .btn { font-size: 15px; padding: 12px 14px; }
.creveal .rbtns .btn.done { background: rgba(255,255,255,.12); color: var(--gobbl); box-shadow: none; }
/* collection */
.card2.locked .sw { background: repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 6px, transparent 6px 12px), #0d0f12 !important; color: var(--rc); font: 900 30px var(--display); box-shadow: inset 0 0 0 2px var(--rc); }
.card2.locked .nm { color: #7d858e; }
.shp-grid.coll .card2 { box-shadow: inset 0 -3px 0 var(--rc); }
.shp-grid.coll .card2.sel { box-shadow: 0 0 0 3px #fff, inset 0 -3px 0 var(--rc); }
.shp-grid.coll .card2 .st { color: var(--rc); font: 900 10px var(--body); letter-spacing: 1px; }
.shp-grid.coll .card2.r-legendary:not(.locked), .shp-grid.coll .card2.r-mythic:not(.locked) { background: color-mix(in srgb, var(--rc) 14%, rgba(255,255,255,.05)); }
/* coin sheet */
#shop.busy .shp { opacity: 0; pointer-events: none; transition: opacity .25s; }
.shp-title { font-size: clamp(18px, 2.2vw, 28px); white-space: nowrap; }
#coinsheet { pointer-events: auto; z-index: 40; background: rgba(0,0,0,.6); align-items: center; justify-content: center; }
#coinsheet .sheet { width: min(480px, calc(100% - 32px)); padding: 20px; border-radius: 22px; background: #14171c; box-shadow: 0 0 0 2px rgba(255,210,59,.5), 0 20px 50px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 12px; color: #fff; text-align: center; }
#coinsheet .sheet > b { font: 900 28px var(--display); color: #ffd23b; }
#coinsheet .sheet > small { font: 600 14px var(--body); color: #b9c1c8; }
#coinsheet .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#coinsheet .pack { padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 4px; align-items: center; }
#coinsheet .pack span { font-size: 28px; } #coinsheet .pack b { font: 900 20px var(--display); color: #ffd23b; } #coinsheet .pack small { font: 700 11px var(--body); color: #9aa3ad; }
#coinsheet .pack button { margin-top: 4px; border: 0; border-radius: 10px; padding: 7px 10px; background: rgba(255,255,255,.1); color: #8a8f96; font: 900 13px var(--body); }
@media (max-aspect-ratio: 1/1) {
  .crate { grid-template-columns: 70px 1fr; }
  .crateart { width: 64px; height: 54px; }
  .buycoins { font-size: 11px; padding: 7px 8px; }
  #crateopen .creveal { left: 16px; right: 16px; width: auto; top: auto; bottom: calc(var(--sb) + 150px); transform: none; padding: 12px; border-radius: 16px; background: rgba(8,9,12,.78); }

  .creveal b { font-size: 30px; }
  #crateopen.revealed .ccards { transform: translateX(-50%) scale(.5); }
  .mcard, .mcard > div { width: 100px; height: 124px; }
  .mcard .lcard { width: 100px; height: 124px; } .mcard .lcard .sw { height: 60px; font-size: 30px; }
}
/* ---- battle pass ---- */
.menu-row { display: flex; gap: 8px; width: 100%; }

.menu-bp em { position: absolute; top: -8px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: #fff; font: 900 12px/20px var(--body); font-style: normal; animation: pulse .6s infinite alternate; }

.bp-xp small { font: 700 12px var(--body); color: #cfd6dc; }
.bp-prem { border: 0; border-radius: 12px; padding: 11px 14px; background: linear-gradient(135deg, #2a1650, #6a2bd9); color: #fff; font: 900 14px var(--body); cursor: pointer; box-shadow: 0 0 0 2px #ffb627, 0 0 20px rgba(255,182,39,.35); white-space: nowrap; }
