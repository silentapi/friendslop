# Paste inside your site's existing `server { ... }` block (e.g. /etc/nginx/sites-available/yoursite),
# then: sudo nginx -t && sudo systemctl reload nginx
# Serves the game at https://yoursite.com/tip-bait/ from /var/www/html/tip-bait
location /tip-bait/ {
    alias /var/www/html/tip-bait/;
    index index.html;
    try_files $uri $uri/ =404;
    gzip on;
    gzip_types application/javascript application/json text/css;
    location ~* \.(json|jpg|webp)$ { expires 7d; add_header Cache-Control "public"; }
    location ~* game\.js$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
